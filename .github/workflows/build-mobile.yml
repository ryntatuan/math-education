name: Release Mobile App (Android APK)

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies & build web dist
        working-directory: ./client
        run: |
          npm ci
          npm run build:web

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Accept Android SDK licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Sync Capacitor Android
        working-directory: ./client
        run: |
          npx cap sync android

      # 🔴 LƯỚI AN TOÀN (giống bước "stripApksFromDir" trong `scripts/build-apk.mjs`).
      #    Từ 2026-09-28 repo KHÔNG còn file APK nào, nên bước này thường không xoá gì — giữ lại
      #    để nếu ai lỡ đặt APK vào `client/public/` thì Vite chép vào `dist`, `cap sync` chép vào
      #    assets Android, và Gradle sẽ ĐÓNG GÓI LẪN APK VÀO APK (đệ quy). Bản 1.0.48: APK trên web
      #    7,2 MB nhưng APK trên Releases phình lên 21,4 MB vì thiếu bước này.
      #    Sửa ở một nơi thì phải sửa ở cả hai nơi.
      - name: Strip embedded .apk files from Android assets
        run: |
          TARGET=./client/android/app/src/main/assets/public
          COUNT=$(find "$TARGET" -name '*.apk' 2>/dev/null | wc -l)
          find "$TARGET" -name '*.apk' -delete 2>/dev/null || true
          echo "Đã xoá $COUNT file .apk khỏi assets Android (tránh đóng gói đệ quy)."

      - name: Build Android Release APK
        working-directory: ./client/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Get App Version
        id: get_version
        run: |
          VERSION=$(node -e "import('./client/src/config/appVersion.js').then(m => console.log(m.APP_VERSION))")
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Current version is $VERSION"

      - name: Rename APK for Distribution
        run: |
          mkdir -p release-output
          cp client/android/app/build/outputs/apk/release/app-release.apk release-output/ToanVui-v${{ steps.get_version.outputs.VERSION }}.apk
          cp client/android/app/build/outputs/apk/release/app-release.apk release-output/ToanVui.apk

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ToanVui-v${{ steps.get_version.outputs.VERSION }}-Release-APK
          path: release-output/ToanVui.apk
          if-no-files-found: error
          retention-days: 30

      - name: Move version tag to this commit
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        run: |
          TAG="v${{ steps.get_version.outputs.VERSION }}"
          # 🔴 VÌ SAO PHẢI ĐẨY TAG BẰNG TAY: `action-gh-release` CHỈ dùng `target_commitish` khi
          #    TẠO tag. Phát hành lại CÙNG một phiên bản (push thêm commit mà không tăng version —
          #    chính là cách repo này giữ cho APK trên web luôn mới) thì tag cũ VẪN nằm ở commit cũ
          #    trong khi file APK trong Release đã được thay bằng bản mới ⇒ tag và asset lệch nhau.
          #    Đo thật 2026-09-28: tag `v1.1.1` trỏ `96b7b71` nhưng asset lại được build từ `02f8781`.
          #    Ghim lại tag vào đúng commit đang chạy TRƯỚC khi tạo Release ⇒ tag luôn = nguồn của asset.
          git tag -f "$TAG" "${{ github.sha }}"
          if git push -f origin "refs/tags/$TAG"; then
            echo "Đã ghim $TAG -> ${{ github.sha }}"
          else
            echo "Không đẩy được tag — bỏ qua, Release vẫn được tạo ở bước sau."
          fi

      - name: Create GitHub Release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.get_version.outputs.VERSION }}
          name: Toán Vui v${{ steps.get_version.outputs.VERSION }}
          # 🔴 BẮT BUỘC: không có dòng này thì `action-gh-release` tạo tag tại **HEAD của nhánh
          #    mặc định LÚC TẠO RELEASE**, không phải tại commit đã kích hoạt workflow. Đã xảy ra
          #    thật ngày 2026-09-28: đẩy 7 phiên bản trong ~6 phút ⇒ các run xếp hàng và về đích
          #    sau khi `main` đã đi tiếp, nên tag `v1.0.50` lại nằm ở commit "chore(release): 1.0.52"
          #    (lệch 2 commit) — tag không còn chỉ đúng nguồn của bản phát hành đó.
          target_commitish: ${{ github.sha }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release-output/ToanVui.apk
            release-output/ToanVui-v${{ steps.get_version.outputs.VERSION }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
