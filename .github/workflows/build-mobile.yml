name: Release Mobile App (Android APK)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies & build web dist
        working-directory: ./client
        run: |
          npm ci
          npm run build:web

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Accept Android SDK licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Sync Capacitor Android
        working-directory: ./client
        run: |
          npx cap sync android

      - name: Build Android Release APK
        working-directory: ./client/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Get App Version
        id: get_version
        run: |
          VERSION=$(node -e "import('./client/src/config/appVersion.js').then(m => console.log(m.APP_VERSION))")
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Current version is $VERSION"

      - name: Rename APK for Distribution
        run: |
          mkdir -p release-output
          cp client/android/app/build/outputs/apk/release/app-release.apk release-output/ToanVui-v${{ steps.get_version.outputs.VERSION }}.apk
          cp client/android/app/build/outputs/apk/release/app-release.apk release-output/ToanVui.apk

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ToanVui-v${{ steps.get_version.outputs.VERSION }}-Release-APK
          path: release-output/ToanVui.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.get_version.outputs.VERSION }}
          name: Toán Vui v${{ steps.get_version.outputs.VERSION }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release-output/ToanVui.apk
            release-output/ToanVui-v${{ steps.get_version.outputs.VERSION }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
